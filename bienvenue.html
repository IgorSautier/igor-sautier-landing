<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--accent:#BB111C;--accent-hover:#a00f18;--t1:#1a1a1a;--t2:#6b6b6b;--t3:#6e6e6e;--bg:#f5f2ef;--sans:'Outfit',system-ui,sans-serif}
body{font-family:var(--sans);background:var(--bg);color:var(--t1);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;-webkit-font-smoothing:antialiased}
a{text-decoration:none}
.avatar{width:88px;height:88px;border-radius:50%;object-fit:cover;margin-bottom:20px}
.check{width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;margin:-40px 0 20px 56px;border:3px solid var(--bg)}
h1{font-size:40px;font-weight:800;line-height:1.15;margin-bottom:12px}
p{font-size:17px;color:var(--t2);max-width:460px;line-height:1.6;margin-bottom:28px}
.btn{display:inline-block;background:var(--accent);color:#fff;padding:13px 28px;border-radius:9999px;font-weight:600;font-size:15px;transition:background .15s}
.btn:hover{background:var(--accent-hover)}
.micro{font-size:13px;color:var(--t3);margin-top:10px}
.links{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin-top:28px;font-size:14px}
.links a{color:var(--t2);transition:color .15s}
.links a:hover{color:var(--accent)}
@media(max-width:768px){h1{font-size:30px}}

/* Phones: 44px touch targets on small links and buttons, without moving the layout */
@media(max-width:768px){
.prompt-link,.about-link,.tools-more,.links a,.guides-header>a,.nl-top>a,.back,.back-bar a{display:inline-block;padding-block:11px;margin-block:-11px}
.back-link{padding-block:11px;margin-top:13px;margin-bottom:13px}
.prompt-copy{min-height:36px}
}
</style>
