[build]
  # Generates /newsletter/ pages and newsletters.json from Brevo (see scripts/build-newsletters.js)
  command = "node scripts/build-newsletters.js"

[build.environment]
  NODE_VERSION = "20"

# Newsletter email images are resized and converted through Netlify's image CDN
[images]
  remote_images = ["https://img\\.mailinblue\\.com/.*"]

[functions]
  directory = "netlify/functions"

# Every Wednesday at 06:00 UTC (7h or 8h in Paris): rebuild with Tuesday's newsletter
[functions."weekly-newsletter-rebuild"]
  schedule = "0 6 * * 3"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    # Everything is served from nevios.fr except the Cal.com booking popup and Umami statistics. Blocks any other foreign script.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://app.cal.com https://cloud.umami.is; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' https://app.cal.com; connect-src 'self' https://app.cal.com https://cal.com https://cloud.umami.is https://gateway.umami.is https://api-gateway.umami.dev; frame-src https://app.cal.com https://cal.com; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"

# Pages are served without ".html" (Netlify Pretty URLs): send old .html addresses to the clean one
[[redirects]]
  from = "/a-propos.html"
  to = "/a-propos"
  status = 301
  force = true
