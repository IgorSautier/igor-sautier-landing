[build]
  # Generates /newsletter/ pages and newsletters.json from Brevo (see scripts/build-newsletters.js)
  command = "node scripts/build-newsletters.js"

[build.environment]
  NODE_VERSION = "20"

# Newsletter email images are resized and converted through Netlify's image CDN
[images]
  remote_images = ["https://img\\.mailinblue\\.com/.*"]

[functions]
  directory = "netlify/functions"

# Every Wednesday at 06:00 UTC (7h or 8h in Paris): rebuild with Tuesday's newsletter
[functions."weekly-newsletter-rebuild"]
  schedule = "0 6 * * 3"

# SAMEORIGIN (not DENY): newsletter pages show the email in a same-site iframe
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    # Everything is served from nevios.fr; inline styles/scripts are part of the pages. Blocks any foreign script.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"
