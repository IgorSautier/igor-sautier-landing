<!-- Page reached from the "Ce mail t'a servi ?" buttons of the newsletter: /merci?avis=carrement|moyen|pas-pour-moi.
     Brevo counts the votes from the link clicks, this page only says thank you. -->

<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--accent:#BB111C;--accent-hover:#a00f18;--t1:#1a1a1a;--t2:#6b6b6b;--bg:#f5f2ef;--line:#ded9d3;--sans:'Outfit',system-ui,sans-serif}
html{color-scheme:light}
body{font-family:var(--sans);background:var(--bg);color:var(--t1);min-height:100vh;min-height:100svh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
header{border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;height:56px;padding:0 20px;max-width:1280px;margin:0 auto;font-size:16px;font-weight:700}
.brand img{width:36px;height:36px;border-radius:50%;object-fit:cover}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px 56px}
.badge{width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:24px}
h1{font-size:32px;font-weight:800;line-height:1.15;margin-bottom:14px}
.msg{font-size:17px;color:var(--t2);line-height:1.6;max-width:440px;margin-bottom:32px}
.actions{display:flex;flex-direction:column;gap:12px;width:100%;max-width:360px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:14px 24px;border-radius:9999px;font-weight:600;font-size:16px;transition:background .15s,border-color .15s,color .15s}
.btn-main{background:var(--accent);color:#fff}
.btn-main:hover{background:var(--accent-hover)}
.btn-alt{background:#fff;border:1px solid var(--line);color:var(--t1)}
.btn-alt:hover{border-color:var(--accent);color:var(--accent)}
@media(min-width:769px){
  .brand{padding:0 48px}
  h1{font-size:44px}
  .actions{flex-direction:row;max-width:none;width:auto}
}
</style>
</head>
<body>
<header>
  <a href="/" class="brand"><img src="/igor-avatar-sm.jpg" alt="" width="36" height="36">Igor Sautier</a>
</header>
<main>
  <div class="badge" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3 3 7-7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <h1>Merci pour ton avis !</h1>
  <p class="msg" id="msg">Content que ça t'ait servi. Rendez-vous mardi prochain.</p>
  <div class="actions">
    <a href="https://www.tiktok.com/@automatise_avec_igor" class="btn btn-alt" target="_blank" rel="noopener"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-2.88 2.5 2.89 2.89 0 01-2.89-2.89 2.89 2.89 0 012.89-2.89c.28 0 .54.04.79.1v-3.5a6.37 6.37 0 00-.79-.05A6.34 6.34 0 003.15 15.2a6.34 6.34 0 006.34 6.34 6.34 6.34 0 006.34-6.34V9.48a8.27 8.27 0 004.76 1.51V7.54a4.83 4.83 0 01-1-.85z"/></svg>Me suivre sur TikTok</a>
    <a href="https://cal.com/igor-sautier/audit-des-taches-automatisables" class="btn btn-main" target="_blank" rel="noopener">Réserver un appel</a>
  </div>
</main>
<script>
// The sentence follows ?avis=... ; no value or an unknown one keeps the "carrement" sentence already in the page
(function () {
  var MESSAGES = {
    'carrement': "Content que ça t'ait servi. Rendez-vous mardi prochain.",
    'moyen': "Merci, je vais faire mieux. Réponds au mail si tu veux me dire ce qui manquait.",
    'pas-pour-moi': "Merci pour ta franchise. Réponds au mail pour me dire ce que tu aimerais lire."
  };
  var avis = (new URLSearchParams(location.search).get('avis') || '').toLowerCase();
  if (Object.prototype.hasOwnProperty.call(MESSAGES, avis)) document.getElementById('msg').textContent = MESSAGES[avis];
})();
</script>
<script src="/cal.js" defer></script>
</body>
</html>
